name: CRM Branch Validation

on:
  push:
    branches:
      - chatgpt-01-crm-customization
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crm-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-validation:
    name: Server lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CI: "true"
      NX_DAEMON: "false"
      NODE_OPTIONS: "--max-old-space-size=8192"

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.13.0"
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Setup Yarn
        run: |
          npm install --global corepack@latest
          corepack enable
          yarn --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint server
        run: yarn nx run twenty-server:lint --configuration=ci

      - name: Typecheck server
        run: yarn nx run twenty-server:typecheck