name: CRM One-time Formatter

on:
  push:
    branches:
      - chatgpt-01-crm-customization
    paths:
      - .github/workflows/crm-format-once.yml

permissions:
  contents: write

jobs:
  format-crm-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: chatgpt-01-crm-customization

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.13.0"
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Setup Yarn
        run: |
          npm install --global corepack@latest
          corepack enable
          yarn --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Format the CRM meeting dialog only
        run: npx oxfmt packages/twenty-front/src/modules/crm/components/ScheduleLeadMeetingButton.tsx

      - name: Commit formatting if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- packages/twenty-front/src/modules/crm/components/ScheduleLeadMeetingButton.tsx; then
            echo "No formatting changes were needed."
          else
            git add packages/twenty-front/src/modules/crm/components/ScheduleLeadMeetingButton.tsx
            git commit -m "style(crm): format lead meeting dialog"
            git push origin HEAD:chatgpt-01-crm-customization
          fi
